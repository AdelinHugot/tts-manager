# Configuration de déploiement Netlify.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Ne jamais définir de secret ici : ce fichier est versionné.
  # ANTHROPIC_API_KEY se configure dans Netlify › Site settings › Environment variables.

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# ---------------------------------------------------------------- en-têtes ---
# La fonction /api/claude est routée par `export const config = { path }` dans
# netlify/functions/claude.js — aucune règle de redirection n'est nécessaire.

[[headers]]
  for = "/*"
  [headers.values]
    # Politique de sécurité du contenu.
    #
    #  - script-src 'self'  : uniquement le bundle servi par le site.
    #  - style-src           : 'unsafe-inline' est requis, l'interface repose sur
    #                          des styles inline (attributs `style`) issus du design.
    #  - connect-src         : notre propre /api/claude, plus les seuls hôtes
    #                          Firebase réellement appelés :
    #                            identitytoolkit  → connexion
    #                            securetoken      → renouvellement du jeton
    #                            firestore        → fiches
    #                            firebasestorage  → fichiers
    #                          Aucun autre domaine Google n'est ouvert : les flux
    #                          par popup ou redirection (apis.google.com, iframe
    #                          sur authDomain) ne sont pas utilisés.
    #  - img-src / media-src : miniatures et vidéos servies depuis Storage.
    #  - blob:               : prévisualisations locales avant envoi.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com; media-src 'self' blob: https://firebasestorage.googleapis.com; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://firebasestorage.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
